<!doctype html>
<!-- Source for public/og-card.jpg, the 1200x630 share card. Render: see README, "Share card". -->
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Chivo";
        font-weight: 700;
        src: url("../node_modules/@fontsource/chivo/files/chivo-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Chivo";
        font-weight: 400;
        src: url("../node_modules/@fontsource/chivo/files/chivo-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Chivo Mono";
        font-weight: 500;
        src: url("../node_modules/@fontsource/chivo-mono/files/chivo-mono-latin-500-normal.woff2") format("woff2");
      }

      :root {
        --night: #07090c;
        --rule: #2a3038;
        --text: #d8d2c4;
        --dim: #7c7f84;
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--night);
        color: var(--text);
        font-family: "Chivo", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
      }

      .text {
        position: absolute;
        top: 72px;
        left: 80px;
        width: 640px;
        height: 486px;
        display: flex;
        flex-direction: column;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 25px;
        font-weight: 700;
      }

      .brand img {
        width: 40px;
        height: 40px;
      }

      h1 {
        margin: 56px 0 0;
        font-size: 61px;
        line-height: 1.05;
        font-weight: 700;
        text-wrap: balance;
      }

      p {
        margin: 24px 0 0;
        max-width: 30ch;
        font-size: 25px;
        line-height: 1.3;
        color: var(--dim);
      }

      .url {
        margin-top: auto;
        font-family: "Chivo Mono", monospace;
        font-weight: 500;
        font-size: 25px;
      }

      /* The real Face screen, bare, with the iPhone display's own corner radius */
      .screen {
        position: absolute;
        top: -122px;
        right: 96px;
        width: 330px;
        border: 1px solid var(--rule);
        border-radius: 38px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="text">
        <div class="brand"><img src="../public/icons/icon.svg" alt="" />Qibla Line</div>
        <h1>Find the Qibla from the walls of your&nbsp;room.</h1>
        <p>A Qibla finder that doesn't trust your phone's compass.</p>
        <div class="url">qiblaline.com</div>
      </div>
      <img class="screen" src="../public/landing/face.webp" alt="" />
    </div>
  </body>
</html>
